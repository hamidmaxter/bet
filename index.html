<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i love you lary ❤️</title>
    <!-- Font Awesome for hearts & icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts for elegant handwriting -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a0b2e 0%, #3b1e4a 40%, #b04e6f 80%, #f9c9b6 100%);
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating hearts container */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;  /* allow clicks through */
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 200, 220, 0.6);
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: float 8s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(255, 100, 150, 0.8);
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main content card */
        .message-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem 3rem 2rem 2rem;
            padding: 3rem 4rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 220, 220, 0.2) inset;
            border: 1px solid rgba(255, 240, 240, 0.3);
            text-align: center;
            max-width: 90%;
            transition: transform 0.3s ease;
            animation: card-appear 1.5s ease-out;
        }

        .message-card:hover {
            transform: scale(1.02);
        }

        @keyframes card-appear {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .love-message {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 700;
            color: #fff9f0;
            text-shadow: 0 0 20px #ff99aa, 0 0 40px #ff4d6d, 2px 4px 8px rgba(0,0,0,0.3);
            line-height: 1.2;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .love-message i {
            color: #ffe6e6;
            font-style: normal;
            animation: heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            70% { transform: scale(1); }
        }

        .sub-message {
            font-size: 1.2rem;
            color: #ffefef;
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,240,0.3);
            margin-top: 1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .sub-message i {
            color: #ffb3c6;
            margin: 0 5px;
        }

        .click-hint {
            margin-top: 2rem;
            font-size: 1rem;
            color: rgba(255,255,240,0.8);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(0,0,0,0.15);
            border: 1px dashed rgba(255,255,255,0.3);
        }

        .click-hint:hover {
            background: rgba(255,200,210,0.2);
            border-color: #ffb6c1;
            transform: translateY(-3px);
        }

        .click-hint i {
            font-size: 1.2rem;
            color: #ffb3c6;
        }

        /* interactive heart burst */
        .burst-heart {
            position: fixed;
            color: #ff99aa;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 100;
            animation: burst 1.2s forwards;
            text-shadow: 0 0 30px #ff4d6d;
        }

        @keyframes burst {
            0% { opacity: 1; transform: scale(0.3) rotate(0deg); }
            100% { opacity: 0; transform: scale(2.5) rotate(30deg); }
        }

        /* responsiveness */
        @media (max-width: 600px) {
            .message-card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .love-message {
                font-size: clamp(2.8rem, 10vw, 4rem);
            }
            .sub-message {
                font-size: 1rem;
                padding: 0.5rem 1rem;
            }
            .click-hint {
                margin-top: 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- background floating hearts (generated by JS) -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- main romantic card -->
    <div class="message-card">
        <h1 class="love-message">
            i love you <i>lary</i> ❤️
        </h1>
        <div class="sub-message">
            <i class="fas fa-star"></i> with all my heart <i class="fas fa-star"></i>
        </div>
        <div class="click-hint" id="clickHint">
            <i class="fas fa-heart"></i> click anywhere for a surprise <i class="fas fa-heart"></i>
        </div>
    </div>

    <script>
        (function() {
            // create floating hearts in the background
            const heartsContainer = document.getElementById('heartsContainer');
            const heartSymbols = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🤍', '💖', '💗', '💓', '💕', '♡'];
            
            // create 40 hearts with random positions, delays, and sizes
            for (let i = 0; i < 40; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                // random heart symbol
                const randomHeart = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.textContent = randomHeart;
                
                // random left position (0-100%)
                heart.style.left = Math.random() * 100 + '%';
                // random bottom position (start off screen at varying heights)
                heart.style.bottom = -20 + Math.random() * 30 + 'px';
                // random size
                const size = 0.8 + Math.random() * 2; // between 0.8rem and 2.8rem
                heart.style.fontSize = size + 'rem';
                // random animation duration between 6s and 18s
                const duration = 6 + Math.random() * 12;
                heart.style.animation = `float ${duration}s infinite ease-in-out`;
                // random delay
                heart.style.animationDelay = Math.random() * 10 + 's';
                // random opacity range
                heart.style.opacity = 0.4 + Math.random() * 0.4;
                
                heartsContainer.appendChild(heart);
            }

            // interactive feature: click anywhere to create a burst heart
            const body = document.body;
            const hint = document.getElementById('clickHint');
            
            function createBurstHeart(x, y) {
                const burst = document.createElement('div');
                burst.className = 'burst-heart';
                burst.textContent = '❤️';
                burst.style.left = x + 'px';
                burst.style.top = y + 'px';
                burst.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(burst);
                
                // remove after animation ends
                setTimeout(() => {
                    burst.remove();
                }, 1200);
            }

            body.addEventListener('click', function(e) {
                // create heart at click position
                createBurstHeart(e.clientX, e.clientY);
                
                // also change the hint text for a moment
                const originalText = hint.innerHTML;
                hint.innerHTML = '<i class="fas fa-heart" style="color:#ffb3c6;"></i> i love you! <i class="fas fa-heart" style="color:#ffb3c6;"></i>';
                setTimeout(() => {
                    hint.innerHTML = originalText;
                }, 800);
            });

            // optional: add a few hearts on touch for mobile
            if ('ontouchstart' in window) {
                body.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    createBurstHeart(touch.clientX, touch.clientY);
                    e.preventDefault(); // avoid double click from emulating mouse
                }, { passive: false });
            }

            // Also make the hint clickable specifically
            hint.addEventListener('click', function(e) {
                e.stopPropagation();  // prevent double burst (already handled by body)
                // but we already have body handler, so we can just let it propagate
                // but we'll create an extra one at hint center for fun
                const rect = hint.getBoundingClientRect();
                createBurstHeart(rect.left + rect.width/2, rect.top + rect.height/2);
            });
        })();
    </script>
</body>
</html>
