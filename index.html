<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>i love you lary ❤️</title>
    <!-- Font Awesome for hearts & icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts for elegant handwriting -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a0b2e 0%, #3b1e4a 40%, #b04e6f 80%, #f9c9b6 100%);
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Floating hearts container */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;  /* allow clicks through */
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 200, 220, 0.6);
            font-size: 1.5rem;
            user-select: none;
            pointer-events: none;
            animation: float 8s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(255, 100, 150, 0.8);
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main content card */
        .message-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem 3rem 2rem 2rem;
            padding: 3rem 4rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 220, 220, 0.2) inset;
            border: 1px solid rgba(255, 240, 240, 0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
            transition: transform 0.3s ease;
            animation: card-appear 1.5s ease-out;
        }

        .message-card:hover {
            transform: scale(1.01);
        }

        @keyframes card-appear {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .love-message {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 700;
            color: #fff9f0;
            text-shadow: 0 0 20px #ff99aa, 0 0 40px #ff4d6d, 2px 4px 8px rgba(0,0,0,0.3);
            line-height: 1.2;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .love-message i {
            color: #ffe6e6;
            font-style: normal;
            animation: heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            70% { transform: scale(1); }
        }

        .sub-message {
            font-size: 1.2rem;
            color: #ffefef;
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 0.6rem 2rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,240,0.3);
            margin-top: 1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .sub-message i {
            color: #ffb3c6;
            margin: 0 5px;
        }

        .click-hint {
            margin-top: 2rem;
            font-size: 1rem;
            color: rgba(255,255,240,0.8);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(0,0,0,0.15);
            border: 1px dashed rgba(255,255,255,0.3);
        }

        .click-hint:hover {
            background: rgba(255,200,210,0.2);
            border-color: #ffb6c1;
            transform: translateY(-3px);
        }

        .click-hint i {
            font-size: 1.2rem;
            color: #ffb3c6;
        }

        /* Reply section */
        .reply-section {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid rgba(255, 240, 240, 0.3);
        }

        .reply-title {
            font-size: 1.5rem;
            color: #ffefef;
            font-family: 'Dancing Script', cursive;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .reply-title i {
            color: #ffb3c6;
            font-size: 1.8rem;
        }

        .reply-box {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .reply-input {
            flex: 2 1 250px;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            color: white;
            font-size: 1rem;
            border: 2px solid rgba(255, 200, 210, 0.5);
            outline: none;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .reply-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        .reply-input:focus {
            border-color: #ffb3c6;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(255, 150, 180, 0.5);
        }

        .reply-button {
            background: #ff99aa;
            border: none;
            border-radius: 60px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c1a2e;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            border-bottom: 4px solid #b24e6a;
        }

        .reply-button i {
            font-size: 1.4rem;
            color: white;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .reply-button:hover {
            transform: translateY(-5px);
            background: #ffb3c6;
            border-bottom-color: #9b3b55;
        }

        .reply-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .privacy-note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: rgba(255, 240, 240, 0.6);
        }

        .privacy-note i {
            margin: 0 4px;
        }

        /* interactive heart burst */
        .burst-heart {
            position: fixed;
            color: #ff99aa;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 100;
            animation: burst 1.2s forwards;
            text-shadow: 0 0 30px #ff4d6d;
        }

        @keyframes burst {
            0% { opacity: 1; transform: scale(0.3) rotate(0deg); }
            100% { opacity: 0; transform: scale(2.5) rotate(30deg); }
        }

        /* responsiveness */
        @media (max-width: 600px) {
            .message-card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .love-message {
                font-size: clamp(2.8rem, 10vw, 4rem);
            }
            .sub-message {
                font-size: 1rem;
                padding: 0.5rem 1rem;
            }
            .click-hint {
                margin-top: 1.5rem;
                font-size: 0.9rem;
            }
            .reply-button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- background floating hearts (generated by JS) -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- main romantic card -->
    <div class="message-card">
        <h1 class="love-message">
            i love you <i>lary</i> ❤️
        </h1>
        <div class="sub-message">
            <i class="fas fa-star"></i> with all my heart <i class="fas fa-star"></i>
        </div>
        <div class="click-hint" id="clickHint">
            <i class="fas fa-heart"></i> click anywhere for a surprise <i class="fas fa-heart"></i>
        </div>

        <!-- Reply section (WhatsApp) -->
        <div class="reply-section">
            <div class="reply-title">
                <i class="fas fa-heart"></i> send your reply <i class="fas fa-heart"></i>
            </div>
            <div class="reply-box">
                <input type="text" class="reply-input" id="replyMessage" placeholder="Type your message... (e.g. I love you too)">
                <button class="reply-button" id="sendReplyBtn">
                    <i class="fab fa-whatsapp"></i> Send
                </button>
            </div>
            <div class="privacy-note">
                <i class="fas fa-lock"></i> opens WhatsApp • your number stays private <i class="fas fa-lock"></i>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // =============================================
            // CONFIGURATION: Set your WhatsApp number here
            // =============================================
            const YOUR_WHATSAPP_NUMBER = "1234567890";  // <-- REPLACE WITH YOUR ACTUAL NUMBER (include country code, no '+' or spaces)
            // Example: "441234567890" for UK, "15551234567" for US

            // create floating hearts in the background
            const heartsContainer = document.getElementById('heartsContainer');
            const heartSymbols = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🤍', '💖', '💗', '💓', '💕', '♡'];
            
            for (let i = 0; i < 40; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                const randomHeart = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.textContent = randomHeart;
                
                heart.style.left = Math.random() * 100 + '%';
                heart.style.bottom = -20 + Math.random() * 30 + 'px';
                const size = 0.8 + Math.random() * 2;
                heart.style.fontSize = size + 'rem';
                const duration = 6 + Math.random() * 12;
                heart.style.animation = `float ${duration}s infinite ease-in-out`;
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.opacity = 0.4 + Math.random() * 0.4;
                
                heartsContainer.appendChild(heart);
            }

            // interactive burst hearts on click
            const body = document.body;
            const hint = document.getElementById('clickHint');
            
            function createBurstHeart(x, y) {
                const burst = document.createElement('div');
                burst.className = 'burst-heart';
                burst.textContent = '❤️';
                burst.style.left = x + 'px';
                burst.style.top = y + 'px';
                burst.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(burst);
                
                setTimeout(() => {
                    burst.remove();
                }, 1200);
            }

            body.addEventListener('click', function(e) {
                createBurstHeart(e.clientX, e.clientY);
                
                const originalText = hint.innerHTML;
                hint.innerHTML = '<i class="fas fa-heart" style="color:#ffb3c6;"></i> i love you! <i class="fas fa-heart" style="color:#ffb3c6;"></i>';
                setTimeout(() => {
                    hint.innerHTML = originalText;
                }, 800);
            });

            // touch support
            if ('ontouchstart' in window) {
                body.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    createBurstHeart(touch.clientX, touch.clientY);
                }, { passive: false });
            }

            hint.addEventListener('click', function(e) {
                e.stopPropagation();
                const rect = hint.getBoundingClientRect();
                createBurstHeart(rect.left + rect.width/2, rect.top + rect.height/2);
            });

            // ========== WHATSAPP REPLY FUNCTION ==========
            const replyInput = document.getElementById('replyMessage');
            const sendBtn = document.getElementById('sendReplyBtn');

            sendBtn.addEventListener('click', function() {
                let message = replyInput.value.trim();
                if (message === '') {
                    message = '❤️ i love you too ❤️';  // default romantic reply if empty
                }
                
                // Encode the message for URL
                const encodedMessage = encodeURIComponent(message);
                
                // Build the WhatsApp link
                const whatsappLink = `https://wa.me/${YOUR_WHATSAPP_NUMBER}?text=${encodedMessage}`;
                
                // Open in a new tab (or same) – this will trigger WhatsApp
                window.open(whatsappLink, '_blank');
                
                // Optional: show a little heart burst at button
                const rect = sendBtn.getBoundingClientRect();
                createBurstHeart(rect.left + rect.width/2, rect.top + rect.height/2);
                
                // Clear the input after sending? Not necessary, but we can
                // replyInput.value = ''; // if you want to clear
            });

            // Allow pressing Enter to send
            replyInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendBtn.click();
                }
            });

            // tiny note: if the number is not set, alert the user to change it
            if (YOUR_WHATSAPP_NUMBER === "+255749246701") {
                console.warn("Please set your WhatsApp number in the code (variable YOUR_WHATSAPP_NUMBER).");
                // Optionally show a friendly reminder in the console, but don't interrupt.
            }
        })();
    </script>
</body>
</html>
